<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Campus Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="layout.css">
<script src="theme.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="logo">CH</span>Campus Hub</a>
  <nav class="links" id="mainNav">
    <a href="index.html">Home</a><a href="register.html">Register</a><a href="signup.html">Sign up</a><a href="signin.html">Sign in</a><a href="home.html">Dashboard</a>
  </nav>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">Dark</button>
</header>
<main>
<form class="form-card" data-validate="register" novalidate>
  <h1>Register</h1>
  <div class="banner" id="banner" role="alert"></div>
  <div class="field"><label for="fullName">Full name</label><input id="fullName" data-rule="fullName" autocomplete="name"><span class="error-msg"></span></div>
  <div class="field"><label for="empId">Employee / Register ID</label><input id="empId" data-rule="empId"><span class="error-msg"></span></div>
  <div class="field"><label for="email">Email address</label><input id="email" type="email" data-rule="email" autocomplete="email"><span class="error-msg"></span></div>
  <div class="field"><label for="mobile">Mobile number</label><input id="mobile" type="tel" inputmode="numeric" maxlength="10" data-rule="mobile"><span class="error-msg"></span></div>
  <div class="field"><label for="dept">Division</label>
    <select id="dept" data-rule="dept">
      <option value="">Select division</option><option>CSE</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option>
    </select><span class="error-msg"></span></div>
  <div class="field"><label for="password">Password</label><input id="password" type="password" data-rule="password" autocomplete="new-password"><span class="error-msg"></span></div>
  <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" data-rule="confirm" autocomplete="new-password"><span class="error-msg"></span></div>
  <button class="btn" type="submit" disabled>Register</button>
</form>
</main>
<script src="validation.js"></script>
</body>
</html>
